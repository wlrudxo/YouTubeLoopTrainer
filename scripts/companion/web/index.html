<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhraseLoop Dictation</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>PhraseLoop Dictation</h1>
        <p>Listen, type, correct, then send verified sentences to Anki.</p>
      </div>
      <button id="refreshButton" type="button">Refresh</button>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="filters" role="group" aria-label="Item status">
          <button type="button" data-filter="all" class="is-active">All</button>
          <button type="button" data-filter="needs_review">Needs review</button>
          <button type="button" data-filter="ready">Ready</button>
          <button type="button" data-filter="synced">In Anki</button>
        </div>
        <p id="summary" class="muted"></p>
        <div id="itemList" class="item-list"></div>
      </aside>

      <section id="workspace" class="workspace">
        <div class="empty-state">Select an imported loop.</div>
      </section>
    </main>

    <template id="workspaceTemplate">
      <article>
        <div class="title-row">
          <div>
            <p class="eyebrow" data-role="source"></p>
            <h2 data-role="title"></h2>
          </div>
          <span class="status-badge" data-role="status"></span>
        </div>

        <section class="card audio-card">
          <audio data-role="audio" controls preload="metadata"></audio>
          <div class="button-row">
            <button type="button" data-action="replay">Replay (Ctrl)</button>
            <button type="button" data-action="retry">Retry MP3</button>
          </div>
          <p class="muted" data-role="processing"></p>
        </section>

        <section class="card">
          <h3>Dictation</h3>
          <textarea data-role="answer" rows="4" placeholder="Type what you hear..."></textarea>
          <div class="button-row">
            <button type="button" data-action="check" class="primary">Check</button>
            <button type="button" data-action="reveal">Show answer</button>
          </div>
          <div data-role="feedback" class="feedback" aria-live="polite"></div>
        </section>

        <section class="card review-card">
          <h3>Manual review</h3>
          <p class="muted">Compare the draft with the audio and save one canonical transcript.</p>
          <label>Transcript<textarea data-role="transcript" rows="4"></textarea></label>
          <label>Meaning<textarea data-role="meaning" rows="3" placeholder="Optional translation or meaning"></textarea></label>
          <label>Notes<textarea data-role="notes" rows="3"></textarea></label>
          <label>Tags<input data-role="tags" type="text" placeholder="conversation, pronunciation" /></label>
          <div class="button-row">
            <button type="button" data-action="save">Save draft</button>
            <button type="button" data-action="ready" class="primary">Mark reviewed</button>
            <button type="button" data-action="discard" class="danger">Discard</button>
            <button type="button" data-action="anki">Add to Anki</button>
          </div>
        </section>
        <p data-role="message" class="message" aria-live="polite"></p>
      </article>
    </template>
  </body>
</html>
