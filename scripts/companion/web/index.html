<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhraseLoop Dictation</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <strong>PhraseLoop Dictation</strong>
          <span class="head-tools">
            <span id="ankiStatus" class="anki-dot" title="Checking Anki..."></span>
            <button id="refreshButton" type="button" class="icon-button" title="Reload items" aria-label="Refresh">&#x27F3;</button>
          </span>
        </div>
        <div class="filters" role="group" aria-label="Item status">
          <button type="button" data-filter="all" class="is-active">All</button>
          <button type="button" data-filter="needs_review">Needs review</button>
          <button type="button" data-filter="synced">In Anki</button>
        </div>
        <p id="summary" class="muted"></p>
        <div id="itemList" class="item-list"></div>
      </aside>

      <section id="workspace" class="workspace">
        <div class="empty-state">Select an imported loop.</div>
      </section>
    </main>

    <template id="workspaceTemplate">
      <article>
        <header class="title-block">
          <img data-role="thumb" class="title-thumbnail" alt="" />
          <div class="title-text">
            <p class="eyebrow"><img data-role="avatar" class="channel-avatar" alt="" /><span data-role="source"></span> <span class="status-badge" data-role="status"></span></p>
            <h2 data-role="title"></h2>
          </div>
        </header>

        <section class="card review-card">
          <div class="audio-row">
            <audio data-role="audio" controls preload="metadata"></audio>
            <button type="button" data-action="replay">Replay (Ctrl)</button>
          </div>
          <p class="muted processing-note" data-role="processing"></p>
          <label>Transcript<textarea data-role="transcript" rows="2"></textarea></label>
          <div class="field-pair">
            <label>Meaning<textarea data-role="meaning" rows="2" placeholder="Optional translation or meaning"></textarea></label>
            <label>Notes<textarea data-role="notes" rows="2"></textarea></label>
          </div>
          <label>Tags<input data-role="tags" type="text" placeholder="conversation, pronunciation" /></label>
          <div class="button-row review-actions">
            <button type="button" data-action="anki" class="primary">Add to Anki</button>
            <button type="button" data-action="save">Save draft</button>
            <span class="spacer"></span>
            <button type="button" data-action="retry" class="subtle">Retry MP3</button>
            <button type="button" data-action="discard" class="danger">Discard</button>
          </div>
        </section>
        <p data-role="message" class="message" aria-live="polite"></p>
      </article>
    </template>
  </body>
</html>
