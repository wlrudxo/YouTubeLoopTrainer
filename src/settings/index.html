<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhraseLoop Settings</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main class="settings">
      <header class="settings-header">
        <div>
          <h1>PhraseLoop Settings</h1>
          <p>Connect the extension to the local dictation companion.</p>
        </div>
      </header>

      <section class="section">
        <h2>Shortcuts</h2>
        <dl class="shortcut-list">
          <div>
            <dt><kbd>[</kbd></dt>
            <dd>Set A</dd>
          </div>
          <div>
            <dt><kbd>]</kbd></dt>
            <dd>Set B</dd>
          </div>
          <div>
            <dt><kbd>\</kbd></dt>
            <dd>Save &amp; send loop</dd>
          </div>
          <div>
            <dt><kbd>Esc</kbd></dt>
            <dd>Stop active loop</dd>
          </div>
        </dl>
      </section>

      <section class="section">
        <h2>Local Dictation Companion</h2>
        <p>Start the companion, then copy its token from <code>PhraseLoopData/config.json</code>.</p>
        <label class="field-label">
          Server URL
          <input id="companionUrl" type="url" value="http://127.0.0.1:17311" />
        </label>
        <label class="field-label">
          Token
          <input id="companionToken" type="password" autocomplete="off" />
        </label>
        <div class="button-row">
          <button id="saveCompanionButton" type="button">Save &amp; Connect</button>
          <button id="openCompanionButton" type="button">Open Dictation</button>
        </div>
      </section>

      <div id="status" class="status" role="status"></div>
    </main>
  </body>
</html>
