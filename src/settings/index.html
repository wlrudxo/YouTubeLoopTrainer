<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhraseLoop Settings</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main class="settings">
      <header class="settings-header">
        <h1>PhraseLoop Settings</h1>
        <p>Import and export your local PhraseLoop library.</p>
      </header>

      <section class="section">
        <h2>Shortcuts</h2>
        <dl class="shortcut-list">
          <div>
            <dt><kbd>[</kbd></dt>
            <dd>Set A</dd>
          </div>
          <div>
            <dt><kbd>]</kbd></dt>
            <dd>Set B</dd>
          </div>
          <div>
            <dt><kbd>\</kbd></dt>
            <dd>Save Loop</dd>
          </div>
          <div>
            <dt><kbd>Esc</kbd></dt>
            <dd>Stop active loop</dd>
          </div>
        </dl>
      </section>

      <section class="section">
        <h2>Export</h2>
        <button id="exportButton" type="button">Export JSON</button>
      </section>

      <section class="section">
        <h2>Import</h2>
        <fieldset>
          <legend>Import Mode</legend>
          <label>
            <input type="radio" name="importMode" value="merge" checked />
            Merge
          </label>
          <label>
            <input type="radio" name="importMode" value="replace" />
            Replace
          </label>
        </fieldset>
        <input id="importFile" type="file" accept="application/json,.json" />
      </section>

      <div id="status" class="status" role="status"></div>
    </main>
  </body>
</html>
