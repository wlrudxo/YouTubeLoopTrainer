<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhraseLoop</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div>
          <h1>PhraseLoop</h1>
          <div id="summary" class="summary">Loading...</div>
        </div>
        <div class="header-actions">
          <button id="settingsButton" class="icon-button" type="button" title="Settings" aria-label="Settings">⚙</button>
        </div>
      </header>

      <div class="button-row">
        <button id="sendAllButton" type="button">Send all</button>
        <button id="openDictationButton" type="button">Open Dictation</button>
      </div>

      <div id="status" class="status" role="status"></div>

      <section class="section" aria-label="Pending loops">
        <div id="loopList" class="loop-list"></div>
      </section>
    </main>
  </body>
</html>
