<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhraseLoop</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div>
          <h1>PhraseLoop</h1>
          <div id="summary" class="summary">Loading...</div>
        </div>
        <div class="header-actions">
          <button id="libraryButton" class="icon-button" type="button" title="Library" aria-label="Library">☰</button>
          <button id="settingsButton" class="icon-button" type="button" title="Settings" aria-label="Settings">⚙</button>
        </div>
      </header>

      <label class="search-wrap">
        <span class="field-label">Search</span>
        <input id="searchInput" type="search" placeholder="Video title or loop label" />
      </label>

      <section class="section" aria-label="Saved videos">
        <div id="videoList" class="video-list"></div>
      </section>
    </main>
  </body>
</html>
