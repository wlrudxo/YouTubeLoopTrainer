<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhraseLoop Library</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main class="library">
      <header class="library-header">
        <div>
